<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GalaxyRover</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stars"></div>

  <header>
    <img src="rlogo.png" class="logo" />
    <h1>GalaxyRover</h1>
  </header>

  <main>
    <div class="generator">
      <button onclick="generateCode()">Generate Code</button>
      <input type="text" id="codeDisplay" readonly />
      <button onclick="copyCode()">Copy</button>
    </div>

    <aside class="history-tab">
      <h2>Code History</h2>
      <ul id="historyList"></ul>
    </aside>
  </main>

  <audio id="genSound" src="sounds/generate.mp3"></audio>
  <script src="script.js"></script>
</body>
</html>
